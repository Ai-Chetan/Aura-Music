name: Release APK

# Cut a release by pushing a version tag:
#   git tag v1.0
#   git push origin v1.0
# Each new v* tag creates one GitHub Release with the release APK attached.
# Normal branch pushes (git push) only run Android CI and never touch Releases.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble debug APK (provides debug keystore fallback)
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign APK with release key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/aura-release.keystore
          APKSIGNER=$(echo $ANDROID_HOME/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          "$APKSIGNER" sign --ks /tmp/aura-release.keystore --ks-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "env:KEY_PASSWORD" --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
          rm /tmp/aura-release.keystore

      - name: Sign APK with debug key (fallback when release secrets are missing)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          APKSIGNER=$(echo $ANDROID_HOME/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Rename APK with tag
        run: cp app/build/outputs/apk/release/app-release-signed.apk "Aura Music-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: Aura Music-*.apk
          generate_release_notes: true
