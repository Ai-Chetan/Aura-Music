name: Release APK

# Cut a release by pushing a version tag:
#   git tag v1.0
#   git push origin v1.0
# Each new v* tag creates one GitHub Release with the release APK attached.
# Normal branch pushes (git push) only run Android CI and never touch Releases.

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: Actions → Release APK → Run workflow → type the tag.
  # Exists because tag-push events can ghost; dispatch always runs.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble debug APK (provides debug keystore fallback)
        run: ./gradlew assembleDebug --stacktrace

      # NOTE: `secrets` must never appear in an `if:` condition — GitHub does
      # not allow the secrets context there and the whole run dies with
      # "No jobs were run". Branch on the (possibly empty) env var in shell.
      - name: Sign APK (release key when secrets exist, else debug key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(echo $ANDROID_HOME/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/app-release-signed.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/aura-release.keystore
            "$APKSIGNER" sign --ks /tmp/aura-release.keystore --ks-pass "env:KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "env:KEY_PASSWORD" --out "$SIGNED" "$UNSIGNED"
            rm /tmp/aura-release.keystore
            echo "Signed with release key."
          else
            "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --out "$SIGNED" "$UNSIGNED"
            echo "Release secrets missing — signed with throwaway debug key."
          fi

      - name: Rename APK with tag
        run: cp app/build/outputs/apk/release/app-release-signed.apk "Aura Music-${RELEASE_TAG}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: Aura Music-*.apk
          generate_release_notes: true
