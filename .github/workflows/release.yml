name: Release APK

# Cut a release by pushing a version tag:
#   git tag v1.0
#   git push origin v1.0
# Each new v* tag creates one GitHub Release with the release APK attached.
# Normal branch pushes (git push) only run Android CI and never touch Releases.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK with tag
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "Aura Music-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: Aura Music-*.apk
          generate_release_notes: true
