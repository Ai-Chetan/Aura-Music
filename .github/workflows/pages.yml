name: Deploy promo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle screenshots into site
        run: |
          mkdir -p site/screenshots
          cp docs/screenshots/library.png site/screenshots/ 2>/dev/null || echo "missing library.png"
          cp docs/screenshots/download.png site/screenshots/ 2>/dev/null || echo "missing download.png"
          cp docs/screenshots/now-playing.png site/screenshots/ 2>/dev/null || echo "missing now-playing.png"
          cp docs/screenshots/song-detail.png site/screenshots/ 2>/dev/null || echo "missing song-detail.png"
          cp docs/screenshots/backup.png site/screenshots/ 2>/dev/null || echo "missing backup.png"
          cp docs/screenshots/lock-screen.png site/screenshots/ 2>/dev/null || echo "missing lock-screen.png"
          ls -la site site/screenshots

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
